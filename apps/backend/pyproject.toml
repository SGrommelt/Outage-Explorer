[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "outage-explorer-backend"
version = "0.1.0"
description = "Outage Explorer API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "duckdb>=1.1,<2",
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "pydantic>=2.9,<3",
  "sqlglot>=26,<30",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
